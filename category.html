<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Servers Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between">
    <nav class="glass-card border-b border-gray-800 p-4 flex justify-between items-center px-8">
        <h1 class="text-2xl font-black text-blue-500 tracking-wider"><a href="index.html">CRAFTHUB</a></h1>
        <a href="index.html" class="text-sm bg-gray-800 px-4 py-2 rounded-lg hover:bg-gray-700">← Back to Hub</a>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-10 flex-grow w-full">
        <h2 id="category-heading" class="text-3xl font-extrabold mb-8 capitalize text-blue-400">Loading Servers...</h2>
        <div id="server-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('cat') || 'cracked';

        document.getElementById('page-title').innerText = `${category.toUpperCase()} Servers`;
        document.getElementById('category-heading').innerText = `${category.replace('-', ' ')} Servers Library`;

        async function loadServers() {
            const grid = document.getElementById('server-grid');
            let servers = JSON.parse(localStorage.getItem('ali_mc_servers')) || [];
            
            // Filter by category and approval status
            servers = servers.filter(s => s.category === category && s.approved);

            if(servers.length === 0) {
                grid.innerHTML = `<p class="text-gray-400 col-span-2 text-center py-10">No servers found in this category yet. Add them via the Admin Portal!</p>`;
                return;
            }

            grid.innerHTML = '';

            for (let server of servers) {
                let statusHtml = `<span class="px-2.5 py-1 text-xs rounded-full font-semibold bg-gray-800 text-gray-400">Checking...</span>`;
                let versionText = "Loading...";

                try {
                    let res = await fetch(`https://api.mcsrvstat.us/2/${server.ip}`);
                    let data = await res.json();
                    if (data.online) {
                        statusHtml = `<span class="px-2.5 py-1 text-xs rounded-full font-semibold bg-green-900 text-green-300">🟢 ${data.players.online}/${data.players.max}</span>`;
                        versionText = data.version || "Java/Bedrock";
                    } else {
                        statusHtml = `<span class="px-2.5 py-1 text-xs rounded-full font-semibold bg-red-900 text-red-300">🔴 Offline</span>`;
                        versionText = "Offline";
                    }
                } catch (e) {
                    statusHtml = `<span class="px-2.5 py-1 text-xs rounded-full font-semibold bg-red-900 text-red-300">🔴 Error</span>`;
                    versionText = "Unknown";
                }

                grid.innerHTML += `
                    <div class="glass-card p-6 rounded-xl border border-gray-800 relative shadow-lg">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="text-xl font-bold text-white">${server.name}</h3>
                                <span class="text-xs bg-gray-800 px-2 py-0.5 rounded text-gray-300 font-mono">${versionText}</span>
                            </div>
                            ${statusHtml}
                        </div>
                        <p class="text-gray-400 text-sm mb-4">${server.description || 'No description provided.'}</p>
                        <div class="flex justify-between items-center mt-4">
                            <code class="bg-gray-900 px-3 py-1.5 rounded text-blue-300 text-sm select-all">${server.ip}</code>
                            <button onclick="navigator.clipboard.writeText('${server.ip}'); alert('Copied IP!');" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded transition">Copy IP</button>
                        </div>
                    </div>
                `;
            }
        }
        loadServers();
    </script>
</body>
</html>
