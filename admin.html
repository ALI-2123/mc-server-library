<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal | Ali's Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between">
    <nav class="glass-card border-b border-gray-800 p-4 flex justify-between items-center px-8">
        <h1 class="text-2xl font-black text-red-500 tracking-wider">ADMIN PORTAL</h1>
        <a href="index.html" class="text-sm bg-gray-800 px-4 py-2 rounded-lg hover:bg-gray-700">← Exit to Public Site</a>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-10 flex-grow w-full">
        <!-- Login Form -->
        <div id="login-section" class="glass-card max-w-md mx-auto p-8 rounded-2xl border border-gray-800 shadow-xl">
            <h2 class="text-2xl font-bold mb-6 text-center text-red-400">Ali's Secure Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Username</label>
                    <input type="text" id="username" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Password</label>
                    <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Approval Code</label>
                    <input type="password" id="code" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-red-500">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-lg transition">Login to Panel</button>
                <p id="login-error" class="text-red-400 text-xs text-center mt-2 hidden">Invalid credentials! Use: ali / 1610 / 11#al</p>
            </form>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-section" class="hidden space-y-8">
            <div class="flex justify-between items-center">
                <h2 class="text-3xl font-extrabold text-white">Server Management Dashboard</h2>
                <button onclick="logout()" class="bg-gray-800 px-4 py-2 rounded-lg text-sm text-red-400 hover:bg-gray-700">Logout</button>
            </div>

            <!-- Add/Edit Server Form -->
            <div class="glass-card p-6 rounded-2xl border border-gray-800">
                <h3 id="form-title" class="text-xl font-bold mb-4 text-blue-400">Add New Server</h3>
                <form id="serverForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" id="server-id">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Server Name</label>
                        <input type="text" id="srv_name" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">IP Address & Port (e.g. play.hypixel.net)</label>
                        <input type="text" id="srv_ip" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Category Page</label>
                        <select id="srv_category" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white">
                            <option value="cracked">Cracked Servers</option>
                            <option value="premium">Premium Servers</option>
                            <option value="pvp-cracked">PvP (Cracked)</option>
                            <option value="pvp-premium">PvP (Premium)</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Description</label>
                        <textarea id="srv_desc" rows="2" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white"></textarea>
                    </div>
                    <div class="flex items-center space-x-2 md:col-span-2">
                        <input type="checkbox" id="srv_approved" checked class="w-4 h-4 text-blue-600 bg-gray-900 border-gray-700 rounded">
                        <label class="text-sm font-semibold text-gray-300">Approve instantly for public viewing</label>
                    </div>
                    <div class="md:col-span-2 flex space-x-4">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2.5 rounded-lg transition">Save Server</button>
                        <button type="button" onclick="resetForm()" class="bg-gray-800 text-gray-300 px-4 py-2.5 rounded-lg">Cancel Edit</button>
                    </div>
                </form>
            </div>

            <!-- Manage Servers List -->
            <div class="glass-card p-6 rounded-2xl border border-gray-800">
                <h3 class="text-xl font-bold mb-4 text-purple-400">All Database Servers</h3>
                <div id="admin-servers-list" class="space-y-3"></div>
            </div>

            <!-- SMP Applications View -->
            <div class="glass-card p-6 rounded-2xl border border-gray-800">
                <h3 class="text-xl font-bold mb-4 text-yellow-400">SMP Applications Submissions</h3>
                <div id="smp-apps-list" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <script>
        const USER = "ali";
        const PASS = "1610";
        const CODE = "11#al";

        if(localStorage.getItem('ali_logged_in') === 'true') {
            showDashboard();
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const c = document.getElementById('code').value;

            if(u === USER && p === PASS && c === CODE) {
                localStorage.setItem('ali_logged_in', 'true');
                showDashboard();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        });

        function logout() {
            localStorage.removeItem('ali_logged_in');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            loadAdminServers();
            loadSmpApps();
        }

        function loadAdminServers() {
            let servers = JSON.parse(localStorage.getItem('ali_mc_servers')) || [];
            const list = document.getElementById('admin-servers-list');
            
            if(servers.length === 0) {
                list.innerHTML = `<p class="text-gray-400 text-sm">No servers added yet.</p>`;
                return;
            }

            list.innerHTML = servers.map(s => `
                <div class="flex justify-between items-center bg-gray-900 p-4 rounded-xl border border-gray-800">
                    <div>
                        <h4 class="font-bold text-white">${s.name} <span class="text-xs text-blue-400">[${s.category}]</span></h4>
                        <p class="text-xs text-gray-400">${s.ip} | Status: ${s.approved ? '✅ Approved' : '⏳ Pending'}</p>
                    </div>
                    <div class="space-x-2">
                        <button onclick='editServer(${s.id})' class="bg-yellow-600 hover:bg-yellow-500 text-white text-xs px-3 py-1.5 rounded">Edit</button>
                        <button onclick="deleteServer(${s.id})" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1.5 rounded">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function loadSmpApps() {
            let apps = JSON.parse(localStorage.getItem('ali_smp_apps')) || [];
            const list = document.getElementById('smp-apps-list');
            
            if(apps.length === 0) {
                list.innerHTML = `<p class="text-gray-400 text-sm">No SMP applications submitted yet.</p>`;
                return;
            }

            list.innerHTML = apps.map(app => `
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-sm">
                    <div class="flex justify-between mb-1">
                        <span class="font-bold text-yellow-300">SMP: ${app.smp_name}</span>
                        <span class="text-xs bg-gray-800 px-2 py-0.5 rounded text-gray-300">Age: ${app.age}</span>
                    </div>
                    <p class="text-gray-300"><strong>Player:</strong> ${app.mc_username} | <strong>Discord:</strong> ${app.discord}</p>
                    ${app.discord_link ? `<p class="text-xs text-blue-400 mt-1"><strong>Discord Link:</strong> <a href="${app.discord_link}" target="_blank" class="underline">${app.discord_link}</a></p>` : ''}
                    <p class="text-gray-400 text-xs mt-2 bg-gray-950 p-2 rounded">"${app.reason}"</p>
                </div>
            `).join('');
        }

        document.getElementById('serverForm').addEventListener('submit', (e) => {
            e.preventDefault();
            let servers = JSON.parse(localStorage.getItem('ali_mc_servers')) || [];
            const id = document.getElementById('server-id').value;

            const serverData = {
                id: id ? Number(id) : Date.now(),
                name: document.getElementById('srv_name').value,
                ip: document.getElementById('srv_ip').value,
                category: document.getElementById('srv_category').value,
                description: document.getElementById('srv_desc').value,
                approved: document.getElementById('srv_approved').checked
            };

            if(id) {
                servers = servers.map(s => s.id == id ? serverData : s);
            } else {
                servers.push(serverData);
            }

            localStorage.setItem('ali_mc_servers', JSON.stringify(servers));
            alert('Server saved successfully!');
            resetForm();
            loadAdminServers();
        });

        function editServer(id) {
            let servers = JSON.parse(localStorage.getItem('ali_mc_servers')) || [];
            const s = servers.find(x => x.id === id);
            if(!s) return;

            document.getElementById('server-id').value = s.id;
            document.getElementById('srv_name').value = s.name;
            document.getElementById('srv_ip').value = s.ip;
            document.getElementById('srv_category').value = s.category;
            document.getElementById('srv_desc').value = s.description;
            document.getElementById('srv_approved').checked = s.approved;
            document.getElementById('form-title').innerText = `Edit Server: ${s.name}`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteServer(id) {
            if(confirm('Delete this server?')) {
                let servers = JSON.parse(localStorage.getItem('ali_mc_servers')) || [];
                servers = servers.filter(s => s.id !== id);
                localStorage.setItem('ali_mc_servers', JSON.stringify(servers));
                loadAdminServers();
            }
        }

        function resetForm() {
            document.getElementById('serverForm').reset();
            document.getElementById('server-id').value = '';
            document.getElementById('form-title').innerText = 'Add New Server';
        }
    </script>
</body>
</html>
